name: FeedCI
description: Fail the build when a deploy breaks your RSS, Atom or JSON feed.
branding:
  icon: rss
  color: yellow
inputs:
  api-key:
    description: A feeds.one API key. Store it as a repository secret.
    required: true
  url:
    description: A live feed URL to check. Use this or file.
    required: false
  file:
    description: Path to a built feed file to check. Use this or url.
    required: false
  fail-on:
    description: Fail on "fail" only, or also on "warn".
    required: false
    default: fail
  require:
    description: Comma-separated checks that must pass, such as item-ids,dates.
    required: false
  min-items:
    description: The fewest items the feed may contain.
    required: false
  stable-ids:
    description: Set to true to fail if an existing item's ID changed since the last check.
    required: false
  max-age-days:
    description: Fail if the newest item is older than this many days.
    required: false
  require-licence:
    description: Set to true to fail if the feed declares no rights or licence information.
    required: false
  baseline:
    description: A name to compare item IDs under. Needed for stable-ids when you check a file.
    required: false
  allow-inconclusive:
    description: Set to true to pass the build when a required check could not run.
    required: false
    default: 'false'
  api-url:
    description: The feeds.one API endpoint.
    required: false
    default: https://feeds.one/api/v1/feed-checks
outputs:
  outcome:
    description: passed, failed or inconclusive.
    value: ${{ steps.check.outputs.outcome }}
  report-url:
    description: Link to the full report.
    value: ${{ steps.check.outputs.report-url }}
runs:
  using: composite
  steps:
    - id: check
      shell: bash
      env:
        FEEDCI_API_KEY: ${{ inputs.api-key }}
        FEEDCI_URL: ${{ inputs.url }}
        FEEDCI_FILE: ${{ inputs.file }}
        FEEDCI_FAIL_ON: ${{ inputs.fail-on }}
        FEEDCI_REQUIRE: ${{ inputs.require }}
        FEEDCI_MIN_ITEMS: ${{ inputs.min-items }}
        FEEDCI_STABLE_IDS: ${{ inputs.stable-ids }}
        FEEDCI_MAX_AGE_DAYS: ${{ inputs.max-age-days }}
        FEEDCI_REQUIRE_LICENCE: ${{ inputs.require-licence }}
        FEEDCI_BASELINE: ${{ inputs.baseline }}
        FEEDCI_ALLOW_INCONCLUSIVE: ${{ inputs.allow-inconclusive }}
        FEEDCI_API_URL: ${{ inputs.api-url }}
      run: bash "$GITHUB_ACTION_PATH/check.sh"
